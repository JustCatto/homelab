services:
  vaultwarden:
    image: vaultwarden/server:1.37.4
    restart: unless-stopped
    user: "1000:1000"
    environment:
      DOMAIN: "https://${VAULTWARDEN_DOMAIN}"
      ROCKET_ADDRESS: "0.0.0.0"
      ROCKET_PORT: "8080"
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      ADMIN_TOKEN: "${VAULTWARDEN_ADMIN_TOKEN:?Set a hashed admin token in .env}"
    volumes:
      - ./data:/data
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: vaultwarden-caddy-cloudflare:2.10.2-v0.2.4
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    restart: unless-stopped
    depends_on:
      - vaultwarden
    environment:
      VAULTWARDEN_DOMAIN: "${VAULTWARDEN_DOMAIN}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_DNS_API_TOKEN:?Cloudflare DNS token required}"
    ports:
      - "${TAILSCALE_IPV4:?Tailscale IPv4 required}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:

volumes:
  caddy_data:
  caddy_config:
